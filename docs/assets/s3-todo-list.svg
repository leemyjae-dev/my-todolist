  <text x="1050" y="196" fill="#5B6472" font-size="13" font-weight="600">수정</text>
  <text x="1100" y="196" fill="#D93A3A" font-size="13" font-weight="600">삭제</text>

  <!-- 카드 2: 장보기 (기본 / 완료) -->
  <rect x="264" y="240" width="892" height="92" rx="10" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/>
  <text x="282" y="275" fill="#1F9254" font-size="16">●</text>
  <text x="308" y="274" fill="#5B6472" font-size="15" font-weight="600" text-decoration="line-through">장보기</text>

  <rect x="400" y="258" width="52" height="22" rx="6" fill="#FFFFFF" stroke="#DDE2EA"/>
  <text x="412" y="273" fill="#5B6472" font-size="12">기본</text>

  <rect x="460" y="258" width="52" height="22" rx="6" fill="#E6F6EC"/>
  <text x="470" y="273" fill="#1F9254" font-size="12" font-weight="600">완료</text>

  <text x="308" y="304" fill="#5B6472" font-size="13">08/24 ~ 08/24</text>

  <text x="1050" y="304" fill="#5B6472" font-size="13" font-weight="600">수정</text>
  <text x="1100" y="304" fill="#D93A3A" font-size="13" font-weight="600">삭제</text>

  <!-- 카드 3: 리포트 제출 (업무 / 지연) -->
  <rect x="264" y="348" width="892" height="92" rx="10" fill="#FFFFFF" stroke="#DDE2EA" stroke-width="1"/>
  <text x="284" y="383" fill="#D93A3A" font-size="16" font-weight="700">!</text>
  <text x="308" y="382" fill="#1A1F2B" font-size="15" font-weight="600">리포트 제출</text>

  <rect x="440" y="366" width="52" height="22" rx="6" fill="#FFFFFF" stroke="#DDE2EA"/>
  <text x="452" y="381" fill="#5B6472" font-size="12">업무</text>

  <rect x="500" y="366" width="52" height="22" rx="6" fill="#FCEAEA"/>
  <text x="511" y="381" fill="#D93A3A" font-size="12" font-weight="600">지연</text>

  <text x="308" y="412" fill="#5B6472" font-size="13">08/10 ~ 08/20</text>

  <text x="1050" y="412" fill="#5B6472" font-size="13" font-weight="600">수정</text>
  <text x="1100" y="412" fill="#D93A3A" font-size="13" font-weight="600">삭제</text>

  <!-- 페이지네이션 -->
  <text x="620" y="480" fill="#5B6472" font-size="14">&lt; 이전</text>
  <text x="700" y="480" fill="#1A1F2B" font-size="14" font-weight="600">1 / 3</text>
  <text x="750" y="480" fill="#5B6472" font-size="14">다음 &gt;</text>
</svg>
